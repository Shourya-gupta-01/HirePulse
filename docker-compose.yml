services:
  postgres:
    image: postgres:16-alpine
    container_name: hirepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hirepulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hirepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: hirepulse-pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/hirepulse?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
    driver: local
